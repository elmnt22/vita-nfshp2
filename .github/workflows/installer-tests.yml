name: Check installer and render policies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test installer/tests/*.test.mjs
      - name: Check native quality transitions and reflection cadence
        run: |
          g++ -std=c++17 -I. -D__SWITCH__ tools/tests/native_quality.cpp -o /tmp/test-switch
          /tmp/test-switch
          g++ -std=c++17 -I. -D__SWITCH__ -D__SWITCH2__ tools/tests/native_quality.cpp -o /tmp/test-switch2
          /tmp/test-switch2
