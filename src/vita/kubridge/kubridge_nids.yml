# kubridge (bythos14/kubridge v0.3.1, exports.yml) user-side syscalls used by the port.
# Library NID read from the vitasdk package's stub (0x6DB9389B). tools/build_port.py turns this
# into a weak stub with the SDK's vita-libs-gen: without kubridge.skprx the calls fail with an
# error instead of stopping the eboot from loading.
version: 2
firmware: 3.60
modules:
  kubridge:
    nid: 0x00000000
    libraries:
      kubridge:
        kernel: false
        nid: 0x6DB9389B
        functions:
          kuKernelRegisterExceptionHandler: 0xF9025D19
          kuKernelReleaseExceptionHandler: 0xDF9F3BED
          kuKernelRegisterAbortHandler: 0x799F5648
          kuKernelReleaseAbortHandler: 0xB188292D
